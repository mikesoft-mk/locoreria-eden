name: Deploy Static Website to VPS

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p 22 \
            "$VPS_USERNAME@$VPS_HOST" << 'EOF'

            set -e

            # Directorio del proyecto en el VPS
            cd /home/miguel/locoreria-eden

            echo "Actualizando repositorio..."
            git pull origin master

            echo "Construyendo y desplegando contenedor..."
            docker compose up -d --build

            echo "Verificando contenedor..."
            docker compose ps

            echo "Despliegue completado correctamente."

          EOF
